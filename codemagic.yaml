workflows:
  android-release:
    name: CHEF'S SECRET Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 2.10.5
      xcode: latest
      cocoapods: default
      groups:
        - recipe_secrets
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --dart-define=SPOONACULAR_API_KEY=$SPOONACULAR_API_KEY
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - varshitharuttala3@gmail.com
        notify:
          success: true
          failure: true
